name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Lint API
        run: pnpm --filter @farmlink/api lint
      - name: Lint Shared
        run: pnpm --filter @farmlink/shared lint
      - name: Typecheck API
        run: pnpm --filter @farmlink/api typecheck
      - name: Build API
        run: pnpm --filter @farmlink/api build

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Run unit tests (API)
        run: pnpm --filter @farmlink/api test:unit
      - name: Run integration tests (requires DB)
        if: false
        run: pnpm --filter @farmlink/api test:integration

  migrate:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Run Prisma migrate deploy
        run: pnpm --filter @farmlink/api db:migrate

terraform:
    needs: migrate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.5.0"
      - name: Terraform Init
        run: terraform init -input=false
      - name: Terraform Format
        run: terraform fmt -check -recursive
      - name: Terraform Validate
        run: terraform validate
      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}